# Publishes the static site on each push to main.
name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build clean URLs
        run: |
          mkdir -p _site
          rsync -a \
            --exclude _site \
            --exclude .git \
            --exclude .github \
            --exclude .cursor \
            --exclude README.md \
            ./ _site/
          for page in about-me ea-games identifit milestone; do
            mkdir -p "_site/$page"
            mv "_site/$page.html" "_site/$page/index.html"
          done

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
