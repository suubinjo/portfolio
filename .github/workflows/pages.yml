# Publishes the static site on each push to main.
name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build clean URLs
        run: |
          mkdir -p _site
          rsync -a \
            --exclude _site \
            --exclude .git \
            --exclude .github \
            --exclude .cursor \
            --exclude README.md \
            ./ _site/
          for page in about-me ea-games identifit milestone; do
            mkdir -p "_site/$page"
            mv "_site/$page.html" "_site/$page/index.html"
          done
          day=$(TZ=Asia/Seoul date +%-d)
          month=$(TZ=Asia/Seoul date +%b)
          year=$(TZ=Asia/Seoul date +%Y)
          case $day in
            11|12|13) suffix=th ;;
            *1) suffix=st ;;
            *2) suffix=nd ;;
            *3) suffix=rd ;;
            *) suffix=th ;;
          esac
          find _site -name '*.html' -print0 | xargs -0 sed -i -E "s/Last updated: [^<]*/Last updated: ${month} ${day}${suffix} ${year}/"

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
